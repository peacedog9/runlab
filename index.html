<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D10">
<title>Run Lab</title>
<style>
:root{
  --bg:#0B0D10; --card:#14181D; --border:#232A33; --text:#E9ECF1; --muted:#8B93A1;
  --bolt:#FF9F0A; --sky:#59C3F0; --clay:#FF6B4A; --ok:#55D68A;
  --bolt-dim:rgba(255,159,10,.12); --sky-dim:rgba(89,195,240,.10); --clay-dim:rgba(255,107,74,.12);
  --ok-dim:rgba(85,214,138,.12);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"SF Pro","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
[hidden]{display:none !important}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{font:inherit;color:var(--text)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--bolt);outline-offset:2px;border-radius:6px}
svg.ic{width:20px;height:20px;flex:none;vertical-align:-4px}

#app{min-height:100dvh;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.page{max-width:680px;margin:0 auto;padding:16px 16px 8px;animation:viewin .18s ease}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.muted{color:var(--muted)}
.small{font-size:13px}
.tnum{font-variant-numeric:tabular-nums}
.brandline{font-size:12px;font-weight:800;letter-spacing:.22em;color:var(--muted);margin:2px 0 10px;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.card.tight{padding:12px 14px}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}

.btn{min-height:44px;border-radius:12px;border:1px solid var(--border);background:#1A2027;color:var(--text);font-size:15px;font-weight:600;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--bolt);color:#0B0D10;border-color:var(--bolt)}
.btn.danger{background:var(--clay);color:#0B0D10;border-color:var(--clay)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;font-size:13px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pill{border-radius:999px;padding:0 14px}

.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip.sky{color:var(--sky);border-color:rgba(89,195,240,.45);background:var(--sky-dim)}
.chip.bolt{color:var(--bolt);border-color:rgba(255,159,10,.45);background:var(--bolt-dim)}
.chip.clay{color:var(--clay);border-color:rgba(255,107,74,.45);background:var(--clay-dim)}
.chip.ok{color:var(--ok);border-color:rgba(85,214,138,.45);background:var(--ok-dim)}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(11,13,16,.96);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:680px;margin:0 auto;display:flex}
.navbtn{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.navbtn svg.ic{width:22px;height:22px}
.navbtn.on{color:var(--bolt)}

.banner{border-radius:14px;padding:12px 16px;margin:0 0 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.amber{background:var(--clay-dim);border:1px solid rgba(255,107,74,.4);color:#FFB4A3}
.banner.skyb{background:var(--sky-dim);border:1px solid rgba(89,195,240,.35);color:#A8DDF6}
.banner .grow{flex:1}

.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}

/* Today */
.hero{display:block;width:100%;text-align:left;border:1px solid var(--border);border-left:4px solid var(--bolt);background:var(--card);border-radius:14px;padding:16px;margin:0 0 10px}
.hero .h-name{font-size:24px;font-weight:800;letter-spacing:-.02em}
.hero .h-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.h-ctas{display:flex;gap:8px;margin-top:12px}
.h-ctas .h-start{flex:1;width:auto}
.modechip{border:1px solid var(--border);border-radius:999px;min-height:44px;padding:0 14px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:#1A2027}
.weekhero{display:flex;gap:10px;margin:0 0 12px}
.weekstat{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.weekstat .ws-num{font-size:30px;font-weight:800;line-height:1.05;letter-spacing:-.02em}
.weekstat .ws-lab{font-size:11px;color:var(--muted);font-weight:600;margin-top:3px}

/* Library */
.libfilter{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chipbtn{border:1px solid var(--border);border-radius:999px;min-height:44px;padding:0 14px;font-size:12px;font-weight:800;color:var(--muted);background:var(--card)}
.chipbtn.on{color:#0B0D10;background:var(--bolt);border-color:var(--bolt)}
.wrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px;width:100%;text-align:left}
.wrow .w-main{flex:1;min-width:0}
.wrow .w-name{font-weight:700;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .w-sub{color:var(--muted);font-size:12px;font-weight:600;margin-top:1px}
.wrow .w-dist{color:var(--text);font-weight:800;font-size:15px;flex:none}
.seglist{border:1px solid var(--border);border-radius:12px;overflow:hidden;margin:10px 0}
.segrow{display:flex;justify-content:space-between;gap:8px;padding:7px 12px;border-bottom:1px solid var(--border);font-size:13px}
.segrow:last-child{border-bottom:none}
.segrow .sg-t{color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:44px}
.segrow .sg-d{flex:1;text-align:center;color:#C7CDD6}
.segrow .sg-i{flex:none;width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.segrow.ph-warmup .sg-d{color:var(--sky)}
.segrow.ph-work .sg-d{color:var(--bolt)}
.segrow.ph-cool .sg-d{color:var(--ok)}

/* Run screen */
#run{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#run[hidden]{display:none !important}
.runhead{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.runhead .t{font-size:16px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.runbody{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0 20px;min-height:0}
.run-phase{font-size:12px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.run-target{display:flex;align-items:baseline;gap:14px}
.run-speed{font-size:84px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.run-speed small{font-size:20px;font-weight:700;color:var(--muted);letter-spacing:0}
.run-inc{font-size:40px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;color:var(--sky)}
.run-inc small{font-size:14px;font-weight:700;color:var(--muted)}
.run-count{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:10px}
.run-countlab{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:-4px}
.run-next{font-size:14px;color:var(--muted);margin-top:10px;text-align:center}
.run-next b{color:var(--text)}
.run-prog{height:4px;background:var(--border);border-radius:2px;margin:0 20px;overflow:hidden}
.run-prog i{display:block;height:100%;background:var(--bolt);width:0}
.runctl{padding:14px 20px calc(18px + env(safe-area-inset-bottom));display:flex;gap:10px}
.runctl .btn{flex:1;min-height:56px;font-size:17px;border-radius:16px}
#run.donepane .run-speed,#run.donepane .run-inc{color:var(--ok)}
.run-donemsg{font-size:15px;color:var(--ok);font-weight:700}

/* History */
.hrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hrow .h-date{color:var(--muted);font-size:12px;font-weight:700;flex:none;width:64px}
.hrow .h-main{flex:1;min-width:0}
.hrow .h-name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .h-sub{color:var(--muted);font-size:12px;font-weight:600}

/* Guide */
.gsec{margin-bottom:16px}
.gsec h3{font-size:13px;letter-spacing:.12em;margin:0 0 6px;color:var(--sky);text-transform:uppercase}
.gsec p{margin:6px 0;font-size:15px;color:#C7CDD6}
ul.plain{margin:8px 0;padding-left:18px}
ul.plain li{margin:5px 0;font-size:14px;color:#C7CDD6}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.setrow:last-child{border-bottom:none}
.setrow .s-lab{font-size:15px}
.setrow .s-sub{font-size:12px;color:var(--muted);margin-top:1px}

#modal-root{position:fixed;inset:0;z-index:60;background:rgba(4,6,8,.66);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);border:1px solid var(--border);border-radius:18px 18px 0 0;width:100%;max-width:680px;max-height:84dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + env(safe-area-inset-bottom));animation:sheetup .2s ease;overscroll-behavior:contain;transition:transform .28s var(--spring)}
.sheet.dragging{transition:none}
.sheet-head{touch-action:none;cursor:grab}
.sheet-head .grabber{width:38px;height:4px;border-radius:2px;background:var(--border);margin:0 auto 10px}
body.modalopen{overflow:hidden}
@keyframes sheetup{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:700px){#modal-root{align-items:center;padding:20px}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:70;background:#1A2027;border:1px solid var(--border);color:var(--text);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#storagewarn{position:fixed;top:0;left:0;right:0;z-index:80;background:var(--clay);color:#0B0D10;font-weight:700;font-size:13px;padding:8px 14px;display:flex;align-items:center;gap:10px;justify-content:center}
#storagewarn button{color:#0B0D10;font-weight:800;min-width:44px;min-height:44px;display:flex;align-items:center}
@supports (font: -apple-system-body){
  body{font:-apple-system-body;line-height:1.5}
  button,input,textarea,select{font:inherit}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ==================== APPLE LAYER ====================
   Additive overrides only. Delete this block to revert exactly.
   Ported from Motion Lab: surfaces, materials, SF Rounded numerals,
   restraint, springs, large title, sentence case. */

:root{
  --card:#15181E;
  --card-2:#1B1F26;
  --hair:rgba(255,255,255,.07);
  --spring:cubic-bezier(.32,.72,0,1);
}

/* 1. Surfaces: kill the strokes, separate with elevation and space. */
.card,.wrow,.hrow,.weekstat,.seglist{
  border:1px solid transparent;
  background:var(--card);
  box-shadow:0 0 0 .5px var(--hair), 0 1px 2px rgba(0,0,0,.3);
}
.hero{
  border:1px solid transparent;
  border-left:4px solid var(--bolt);
  box-shadow:0 0 0 .5px var(--hair), 0 6px 20px rgba(0,0,0,.38);
}
.btn{border-color:transparent;background:var(--card-2);box-shadow:0 0 0 .5px var(--hair)}
.btn.primary{box-shadow:0 1px 8px rgba(255,159,10,.22)}
.chip{border-color:transparent;box-shadow:0 0 0 .5px var(--hair)}

/* 2. Materials: content should show through anything floating above it. */
.nav{
  background:rgba(11,13,16,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-top:.5px solid var(--hair);
}
.sheet{
  border:none;
  background:rgba(24,28,34,.86);
  -webkit-backdrop-filter:saturate(180%) blur(30px);
  backdrop-filter:saturate(180%) blur(30px);
  box-shadow:0 -12px 40px rgba(0,0,0,.5);
}
.runhead{
  background:rgba(11,13,16,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
}
.runctl{
  background:rgba(11,13,16,.76);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
}

/* 3. Numerals in SF Rounded: the metric IS the content. */
.tnum,.run-speed,.run-inc,.run-count,.weekstat .ws-num,.wrow .w-dist,.segrow .sg-t,.segrow .sg-i{
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  letter-spacing:0;
}

/* 4. Restraint: tab labels sentence case, brandline quiet. */
.navbtn{text-transform:none;letter-spacing:0;font-size:10.5px;font-weight:600}
.navbtn.on{color:var(--bolt)}
.brandline{font-size:11px;letter-spacing:.14em;color:#6E7683;font-weight:700;margin-bottom:6px}

/* 5. Motion with physics, and none when the system asks for stillness. */
.wrow,.hrow,.btn,.chip,.weekstat{transition:transform .28s var(--spring),background-color .2s ease,box-shadow .28s var(--spring)}
.wrow:active,.btn:active,.hrow:active{transform:scale(.975)}
.sheet{animation:sheetup .42s var(--spring)}
@media (prefers-reduced-motion:reduce){
  .wrow,.hrow,.btn,.chip,.weekstat{transition:none}
  .wrow:active,.btn:active,.hrow:active{transform:none}
  .sheet{animation:none}
}

/* 6. Large title, collapsing on scroll. */
.lt{padding:2px 0 14px}
.lt-eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6E7683;margin-bottom:2px}
.lt-title{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.022em;margin:0}
.lt-sub{margin-top:4px;color:var(--muted);font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lt.shrunk .lt-title{font-size:22px}
.lt.shrunk .lt-eyebrow{opacity:0;height:0;margin:0;overflow:hidden}
.lt-title,.lt-eyebrow{transition:font-size .28s var(--spring),opacity .2s ease}
@media (prefers-reduced-motion:reduce){.lt-title,.lt-eyebrow{transition:none}}

/* 7. Sentence case. Chips keep small-caps eyebrows only where correct. */
.chip{text-transform:none;letter-spacing:0;font-weight:600}

/* 8. Progress bar on the run screen is the one ring-equivalent surface. */
.run-prog{border-radius:2px}
.run-prog i{transition:width .5s linear}
@media (prefers-reduced-motion:reduce){.run-prog i{transition:none}}

/* 9. Today is a decision surface, not a dashboard. Keep one compact status,
   one recommendation and one primary action in the first viewport. */
.today-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:600;margin:-4px 0 14px}
.today-status:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--bolt);box-shadow:0 0 0 4px rgba(255,159,10,.1)}
.hero-why{margin-top:7px;color:#C7CDD6;font-size:14px;line-height:1.45}
.hero-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}
.quiet-action{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:2px 2px 0;color:var(--muted);font-size:13px}
.quiet-action .btn{min-height:44px;white-space:nowrap}
/* ================== END APPLE LAYER ================== */
</style>
</head>
<body>
<div id="app"></div>
<div id="run" hidden></div>
<div id="modal-root" hidden></div>
<div id="toast" role="status"></div>
<script>
"use strict";

/* ---------- program data, transcribed from the library document ----------
   Segment arrays are [seconds, speed offset from B (mph), incline percent].
   B is the baseline lane. Every block is exactly 300 seconds; the battery
   proves it by summing. Speeds are bounded to 2.5-10.0 mph and progressive
   grades to 9% AFTER formulas resolve. */

const LIMITS = { minMph: 2.5, maxMph: 10.0, maxInc: 9.0 };
const WU = [[120, -1.0, 0.5], [120, 0, 1.0], [60, 0.5, 1.5]];
const CD = [[120, -1.0, 1.0], [180, -1.5, 0]];

const BLOCKS = {
  "S-A": [[60, 1, 1], [30, 3, 1], [60, -1, 0.5], [30, 3.5, 2], [60, -1, 0.5], [30, 4, 3], [30, -1, 0]],
  "S-B": [[30, 2, 1], [45, -1, 0.5], [30, 2.5, 2], [45, -1, 0.5], [30, 3, 3], [45, -1, 0.5], [30, 3.5, 1], [45, -1, 0]],
  "S-C": [[60, 1, 1], [60, 2, 1.5], [30, 3, 2], [60, -1, 0.5], [30, 3.5, 3], [60, -1, 0]],
  "S-D": [[20, 2.5, 1], [40, -1, 0.5], [20, 3, 2], [40, -1, 0.5], [20, 3.5, 3], [40, -1, 0.5], [20, 3, 4], [40, -1, 0.5], [20, 4, 2], [40, -1, 0.5]],
  "T-A": [[180, 1, 1], [60, -0.5, 0.5], [60, 1.5, 2]],
  "T-B": [[120, 1, 1], [60, 1.5, 2], [60, -0.5, 0.5], [60, 1, 3]],
  "T-C": [[60, 0.5, 1], [60, 1, 2], [60, 1.5, 3], [60, 1, 2], [60, 0.5, 1]],
  "T-D": [[90, 1, 1], [30, -0.5, 0.5], [90, 1.25, 2], [30, -0.5, 0.5], [60, 1.5, 1]],
  "H-A": [[60, 0, 2], [60, -0.5, 4], [60, -1, 6], [60, -0.5, 4], [60, 0, 2]],
  "H-B": [[120, -0.5, 5], [60, -1, 1], [60, -1, 7], [60, -1, 1]],
  "H-C": [[60, 0, 3], [60, -0.5, 5], [60, -1, 7], [60, -0.5, 5], [60, 0, 3]],
  "H-D": [[30, 0, 2], [30, -0.25, 4], [30, -0.5, 6], [30, -0.75, 8], [30, -0.5, 6], [30, -0.25, 4], [60, -1, 1], [60, 0, 3]],
  "M-A": [[60, 0, 2], [60, 1, 3], [30, 3, 1], [60, -1, 0.5], [60, 1.5, 2], [30, -1, 0]],
  "M-B": [[60, -0.5, 5], [30, 2.5, 2], [60, -1, 0.5], [60, 1, 1], [30, 3.5, 3], [60, -1, 0]],
  "M-C": [[60, 0, 1], [60, -0.5, 4], [60, 1, 2], [30, 3, 1], [30, -1, 0.5], [30, 3.5, 2], [30, -1, 0]],
  "M-D": [[30, 2, 1], [30, -1, 0.5], [60, -0.5, 5], [60, 1, 2], [30, 3, 2], [30, -1, 0.5], [60, 0, 3]],
  "M-E": [[60, 0.5, 2], [60, -0.5, 6], [30, 3, 1], [30, -1, 0.5], [60, 1.5, 3], [60, -1, 0]]
};

/* base: fixed number, or {lo, hi} for a range lane. prog: null | "sprint" |
   "tempo" | "hill" | "mixed". dist is the published estimate; range rows
   also carry the published low and high. rpe is the app difficulty tag. */
const WORKOUTS = [
  { id: "S01", name: "Quick Ignition", min: 20, type: "sprint", base: 4, blocks: ["S-A", "S-B"], prog: null, dist: 1.30, rpe: 8 },
  { id: "S02", name: "Fast 30s", min: 25, type: "sprint", base: 5, blocks: ["S-B", "S-C", "S-D"], prog: null, dist: 2.10, rpe: 8 },

const TYPE_LABEL = { sprint: "Sprint", tempo: "Tempo", hill: "Hill", mixed: "Mixed" };
const PHASE_LABEL = { warmup: "Warm up", work: "Work", cooldown: "Cool down" };
const byId = id => WORKOUTS.find(w => w.id === id);
const isRange = w => w.base && typeof w.base === "object";

/* ---------- resolver ----------
   Expands a workout into a flat, fully numeric timeline for one chosen
   baseline B. Progression: n = main blocks already completed. sprint work
   +0.20n mph, tempo work +0.15n mph, hill grades above 1% +0.5n points,
   mixed both (+0.15n on speed work, +0.5n on grades 2% and up). Limits
   clamp AFTER progression. Range workouts resolve once from the single
   chosen B and never revisit it. */
function resolveWorkout(w, B, diffPct){
  if(isRange(w)){
    if(typeof B !== "number" || !(B >= w.base.lo && B <= w.base.hi)) B = 5.0;
  } else {
    B = w.base;
  }
  const diff = (typeof diffPct === "number" ? diffPct : (state.settings.diff || 0)) / 100;
  const segs = [];
  let t = 0;
  const push = (dur, mph, inc, phase, blockId, work, mainIdx) => {
    segs.push({ index: segs.length, t0: t, dur: dur, mph: mph, inc: inc, phase: phase, block: blockId, work: work, mainIdx: mainIdx });
    t += dur;
  };
  WU.forEach(sg => push(sg[0], B + sg[1], sg[2], "warmup", "WU", false, -1));
  let n = 0;
  w.blocks.forEach((bid, bi) => {
    BLOCKS[bid].forEach(sg => {
      let off = sg[1], inc = sg[2];
      const work = off > 0;
      if(w.prog){
        if(off > 0 && (w.prog === "sprint" || w.prog === "tempo" || w.prog === "mixed")){
          off += (w.prog === "sprint" ? 0.20 : 0.15) * n;
        }
        if(w.prog === "hill" && inc > 1) inc += 0.5 * n;
        if(w.prog === "mixed" && inc >= 2) inc += 0.5 * n;
      }
      // Difficulty scales the size of every work step and every grade
      // above 1%, after progression and before the caps. Warm-up,
      // cool-down and recoveries are never touched: harder means a bigger
      // gap between work and rest, not a faster warm-up.
      if(diff > 0){
        if(off > 0) off = off * (1 + diff);
        if(inc > 1) inc = inc * (1 + diff);
      }
      let mph = B + off;
      if(mph < LIMITS.minMph) mph = LIMITS.minMph;
      if(mph > LIMITS.maxMph) mph = LIMITS.maxMph;
      if(inc > LIMITS.maxInc) inc = LIMITS.maxInc;
      if(inc < 0) inc = 0;
      push(sg[0], Math.round(mph * 100) / 100, Math.round(inc * 100) / 100, "work", bid, work, bi);
    });
    n++;
  });
  CD.forEach(sg => push(sg[0], B + sg[1], sg[2], "cooldown", "CD", false, -1));
  const total = t;
  const distance = segs.reduce((a, s) => a + (s.dur / 3600) * s.mph, 0);
  return { id: w.id, name: w.name, lane: B, diff: diff, segments: segs, total: total, distance: Math.round(distance * 100) / 100 };
}

/* ---------- spoken numbers ---------- */
const ONES = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten",
  "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
const TENS = { 2: "twenty", 3: "thirty", 4: "forty", 5: "fifty", 6: "sixty", 7: "seventy", 8: "eighty", 9: "ninety" };
function numWords(x){
  x = Math.round(x);
  if(x < 20) return ONES[x];
  if(x < 100){
    const t = Math.floor(x / 10), r = x % 10;
    return TENS[t] + (r ? " " + ONES[r] : "");
  }
  return String(x);
}
// Speeds read like a treadmill console: "seven point zero", never "seven".
// Inclines read naturally: "three percent", "zero point five percent".
function decWords(x, minDec){
  const r = Math.round(x * 100) / 100;
  let dec;
  if(minDec === 1) dec = ((r * 10) % 1 === 0) ? 1 : 2;
  else dec = ((r % 1) === 0) ? 0 : (((r * 10) % 1 === 0) ? 1 : 2);
  const parts = r.toFixed(dec).split(".");
  let out = numWords(parseInt(parts[0], 10));
  if(parts[1]) out += " point " + parts[1].split("").map(d => ONES[parseInt(d, 10)]).join(" ");
  return out;
}
function speakMph(m){ return decWords(m, 1); }
function speakInc(i){ return i === 0 ? "flat" : decWords(i) + " percent"; }
function speakDur(sec){
  if(sec % 60 === 0) return numWords(sec / 60) + (sec === 60 ? " minute" : " minutes");
  if(sec < 60) return numWords(sec) + " seconds";
  return numWords(sec) + " seconds";
}

/* ---------- cue timeline ----------
   Every cue is computed once at resolve time so the native runner receives
   plain strings and numbers, never formulas. Change cues land at the exact
   boundary; the runner fires them (and the 10s warning and the 3-2-1)
   `lead` seconds early so the treadmill console catches up. Incline is
   omitted when it is unchanged from the previous segment. */
function buildCues(segs, total){
  const cues = [];
  for(let i = 0; i < segs.length; i++){
    const s = segs[i];
    const prev = i > 0 ? segs[i - 1] : null;
    if(prev) cues.push({ t: s.t0 - 10, kind: "ten", text: "Ten seconds." });
    if(s.work && s.dur <= 30){
      cues.push({ t: s.t0 - 3, kind: "count", text: "Three." });
      cues.push({ t: s.t0 - 2, kind: "count", text: "Two." });
      cues.push({ t: s.t0 - 1, kind: "count", text: "One." });
    }
    const parts = [speakMph(s.mph)];
    if(!prev || prev.inc !== s.inc) parts.push(speakInc(s.inc));
    parts.push(speakDur(s.dur));
    let text = parts.join(", ") + ".";
    if(!prev || prev.phase !== s.phase) text = PHASE_LABEL[s.phase] + ". " + text;
    cues.push({ t: s.t0, kind: "change", text: text });
  }
  cues.push({ t: total, kind: "done", text: "Done." });
  cues.sort((a, b) => a.t - b.t);
  return cues;
}

/* ---------- storage contract (ported from Motion Lab verbatim) ---------- */
const STORE_KEY = "runner.v1";
// Replaces unpaired surrogates (damage from a truncated write) with U+FFFD
// so the storage layer will accept the copy; every readable character of
// the damaged payload survives. No lookbehind: keeps iOS 16.0 JSC safe.
function sanitizeUtf16(s){
  let out = "";
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if(c >= 0xD800 && c <= 0xDBFF){
      const n = s.charCodeAt(i + 1);
      if(n >= 0xDC00 && n <= 0xDFFF){ out += s.charAt(i) + s.charAt(i + 1); i++; }
      else out += "\uFFFD";
    } else if(c >= 0xDC00 && c <= 0xDFFF){
      out += "\uFFFD";
    } else out += s.charAt(i);
  }
  return out;
}
const BACKUP_KEY = "runner.backup.v1";
const Store = {
  available: true,
  readKey(k){
    try{ return localStorage.getItem(k); }
    catch(e){ this.available = false; return undefined; }
  },
  writeKey(k, v){
    try{ localStorage.setItem(k, v); return true; }
    catch(e){ this.available = false; return false; }
  },
  parseState(raw){
    try{
      const p = JSON.parse(raw);
      if(p && typeof p === "object" && p.version === 1) return p;
    }catch(e){}
    return null;
  },
  loadPrimary(){
    const raw = this.readKey(STORE_KEY);
    if(raw === undefined) return { status: "corrupt", raw: null };
    if(raw == null) return { status: "empty" };
    const p = this.parseState(raw);
    return p ? { status: "ok", state: p } : { status: "corrupt", raw: raw };
  },
  loadBackup(){
    const raw = this.readKey(BACKUP_KEY);
    if(!raw) return null;
    try{
      const env = JSON.parse(raw);
      if(env && env.state && this.parseState(JSON.stringify(env.state))){
        return { at: env.at, state: env.state };
      }
    }catch(e){}
    return null;
  },
  quarantine(raw, kind){
    if(!raw) return false;
    if(this.quarantineExists(raw, kind)) return true;
    const k = "runner.corrupt." + (kind ? kind + "." : "") + Date.now();
    if(!this.writeKey(k, raw)){
      const clean = sanitizeUtf16(raw);
      if(!clean || clean === raw || !this.writeKey(k, clean)) return false;
      const backC = this.readKey(k);
      return !!(backC && backC.length === clean.length);
    }
    const back = this.readKey(k);
    if(!back || back.length !== raw.length) return false;
    return true;
  },
  quarantineExists(raw, kind){
    try{
      const prefix = "runner.corrupt." + (kind ? kind + "." : "");
      const clean = sanitizeUtf16(raw);
      const n = localStorage.length;
      for(let i = 0; i < n; i++){
        const k = localStorage.key(i);
        if(!k || k.indexOf(prefix) !== 0) continue;
        const v = this.readKey(k);
        if(v != null && (v === raw || v === clean)) return true;
      }
    }catch(e){}
    return false;
  },
  save(st){
    const main = JSON.stringify(st);
    const clean = JSON.parse(main);
    delete clean.backup;
    const okB = this.writeKey(BACKUP_KEY, JSON.stringify({ at: new Date().toISOString(), state: clean }));
    const okP = this.writeKey(STORE_KEY, main);
    if(!okB || !okP){ this.available = false; storageWarnShow(); return false; }
    return true;
  }
};
function bootState(){
  const prim = Store.loadPrimary();
  if(prim.status === "ok"){
    const rawB = Store.readKey(BACKUP_KEY);
    if(rawB != null && !Store.parseState((() => { try{ const e = JSON.parse(rawB); return e && e.state ? JSON.stringify(e.state) : ""; }catch(err){ return ""; } })())){
      Store.quarantine(rawB, "backup");
    }
    return { state: hydrate(prim.state) };
  }
  if(prim.status === "empty") return { state: hydrate(null) };
  const kept = Store.quarantine(prim.raw, "primary");
  const bak = Store.loadBackup();
  if(bak) return { state: hydrate(bak.state), restoredAt: bak.at, kept: kept };
  const rawB = Store.readKey(BACKUP_KEY);
  const keptB = rawB ? Store.quarantine(rawB, "backup") : false;
  const uncopied = [];
  if(!kept) uncopied.push("saved data");
  if(rawB && !keptB) uncopied.push("backup");
  return { blocked: true, kept: kept || keptB, uncopied: uncopied };
}

function defaultState(){
  return { version: 1, createdAt: new Date().toISOString(), logs: [],
    settings: { lane: 5.0, voice: "speech", lead: 3, diff: 0 } };
}

let AC = null;

  if(AC) return;

}

function tone(freq, dur, gain, delay, type){
  if(!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(gain, t0);

function cueCountTone(){ try{ tone(1100, 0.14, 0.34); }catch(e){} }

function cueTenTone(){ try{ tone(660, 0.1, 0.16); }catch(e){} }
function cueDoneTone(){ try{ tone(523, 0.14, 0.22); tone(784, 0.22, 0.22, 0.12); tone(1046, 0.3, 0.18, 0.3); }catch(e){} }
function cueGoTone(){ try{ tone(1046, 0.09, 0.22); tone(1568, 0.14, 0.22, 0.06); }catch(e){} }
let VOICE = null, voicePicked = false;
function pickVoice(){
  if(voicePicked) return VOICE;
  try{
    const vs = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if(vs && vs.length){
      const en = vs.filter(v => /^en(-|_|$)/i.test(v.lang || ""));
      const pool = en.length ? en : vs;
      // Samantha (the harsh default) is the last resort; Enhanced/Premium
      // variants of Ava and friends come first.
      const byName = re => pool.find(v => re.test(v.name || ""));
      VOICE = byName(/\b(ava|zoey|zoe|allison|nicky|susan|joelle)\b.*\((enhanced|premium)\)/i)
           || byName(/\((enhanced|premium)\)/i)
           || byName(/\b(ava|zoey|zoe|allison|nicky|susan|joelle)\b/i)
           || byName(/\b(karen|moira|tessa|serena|fiona|victoria)\b/i)
           || byName(/female/i)
           || byName(/samantha/i)
           || pool[0] || null;
      voicePicked = true;
    }
  }catch(e){ VOICE = null; }
  return VOICE;
}
try{ if(window.speechSynthesis) window.speechSynthesis.onvoiceschanged = () => { voicePicked = false; pickVoice(); }; }catch(e){}

/* ---------- wake lock (web only; the wrapper's native clock never sleeps) ----------
   A browser tab gets suspended the moment the screen locks, so the web
   version asks to keep the screen awake for the duration of a run. If the
   browser refuses, the run still works with the screen on. */
let RUN_WAKE_LOCK = null;
async function requestWakeLock(){
  try{
    if(navigator.wakeLock && navigator.wakeLock.request) RUN_WAKE_LOCK = await navigator.wakeLock.request("screen");
  }catch(e){ RUN_WAKE_LOCK = null; }
}
function releaseWakeLock(){
  try{ if(RUN_WAKE_LOCK && RUN_WAKE_LOCK.release) RUN_WAKE_LOCK.release(); }catch(e){}
  RUN_WAKE_LOCK = null;
}
document.addEventListener("visibilitychange", () => {
  // Browsers drop the lock when the tab hides; re-claim on return if a
  // workout is still going.
  if(document.visibilityState === "visible" && SESSION && !SESSION.done) requestWakeLock();

/* ---------- native bridge ----------
   Inside the wrapper the workout clock lives in Swift: iOS suspends JS
   timers in the background, so the page only renders what Swift posts.
   In a plain browser the same cue semantics run on a JS clock so the
   web version is not dead. Both paths consume the identical resolved
   timeline; only the scheduler differs. */
function nativeBridge(){
  try{
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.runner)
      return window.webkit.messageHandlers.runner;
  }catch(e){}
  return null;
}
function postNative(msg){
  const b = nativeBridge();

}

/* ---------- run session ---------- */
let SESSION = null;   // { res, cues, lead, elapsed, segIdx, paused, done, skips, native, jsAnchor, jsTimer, jsCue }
let RUN = null;       // run screen state for rendering

function startWorkout(id, laneOverride){
  const w = byId(id);
  if(!w || SESSION) return;
  const lane = isRange(w) ? (typeof laneOverride === "number" ? laneOverride : state.settings.lane) : w.base;
  const res = resolveWorkout(w, lane);
  const cues = buildCues(res.segments, res.total);
  SESSION = { res: res, cues: cues, lead: state.settings.lead, voice: state.settings.voice,
    elapsed: 0, segIdx: 0, paused: false, done: false, skips: 0, native: !!nativeBridge(),
    jsAnchor: 0, jsTimer: null, jsCue: 0 };
  openRun();
  haptic("tick");
  // Get-ready lead-in: three tick tones, no spoken digits, so the first
  // spoken line is the warm-up target itself.
  let n = 3;
  const stepIn = () => {
    if(n > 0){ cueCountTone(); renderRunGetReady(n); n--; setTimeout(stepIn, 1000); }
    else { cueGoTone(); engineStart(); }
  };
  renderRunGetReady(3);
  setTimeout(stepIn, 400);
}
function engineStart(){
  if(!SESSION || SESSION.done) return;
  requestWakeLock();
  if(SESSION.native){
    postNative({
      action: "start",
      name: SESSION.res.name,
      id: SESSION.res.id,
      lane: SESSION.res.lane,
      distance: SESSION.res.distance,
      total: SESSION.res.total,
      voiceMode: SESSION.voice,
      leadSec: SESSION.lead,
      segments: SESSION.res.segments.map(s => ({ i: s.index, t0: s.t0, dur: s.dur, mph: s.mph, inc: s.inc, phase: s.phase, work: !!s.work })),
      cues: SESSION.cues

    SESSION.jsAnchor = performance.now() / 1000;
    SESSION.jsCue = 0;
    SESSION.jsTimer = setInterval(jsEngineTick, 200);
    jsEngineTick();

}
function jsEngineTick(){
  if(!SESSION || SESSION.done || SESSION.paused) return;
  const now = performance.now() / 1000;
  const el = now - SESSION.jsAnchor;
  SESSION.elapsed = el;
  const lead = SESSION.lead;
  // Fire every cue whose fire time (boundary minus console lead) has passed.
  while(SESSION.jsCue < SESSION.cues.length && SESSION.cues[SESSION.jsCue].t - lead <= el + 0.05){
    fireCue(SESSION.cues[SESSION.jsCue]);
    SESSION.jsCue++;
  }
  if(el >= SESSION.res.total){ finishWorkout({ elapsed: SESSION.res.total }); return; }
  onTick(el);
}
function fireCue(c){
  if(SESSION.voice === "tones"){
    if(c.kind === "ten") cueTenTone();
    else if(c.kind === "count") cueCountTone();
    else if(c.kind === "change") cueChangeTone();
    else if(c.kind === "done") cueDoneTone();
  } else {
    say(c.text);
    if(c.kind === "count") cueCountTone();
    else if(c.kind === "done") cueDoneTone();

function pauseToggle(){

    else { SESSION.jsAnchor = performance.now() / 1000 - SESSION.elapsed; SESSION.jsTimer = setInterval(jsEngineTick, 200); }
  } else {

}
function skipSegment(){
  if(!SESSION || SESSION.done) return;

  let i = segs.findIndex(s => s.t0 > SESSION.elapsed + 0.25);
  if(i < 0){ finishWorkout({ elapsed: SESSION.res.total }); return; }
  const jumpTo = segs[i].t0;
  if(SESSION.native){
    postNative({ action: "skip" });
    SESSION.elapsed = jumpTo;
    onTick(jumpTo);
  } else {
    SESSION.elapsed = jumpTo;
    SESSION.jsAnchor = performance.now() / 1000 - jumpTo;
    SESSION.jsCue = SESSION.cues.findIndex(c => c.t - SESSION.lead > jumpTo + 0.05);
    if(SESSION.jsCue < 0) SESSION.jsCue = SESSION.cues.length;
    // The boundary cue of the segment we jumped to still needs to be heard.
    const boundary = SESSION.cues.find(c => c.kind === "change" && c.t === jumpTo);

function finishWorkout(summary){
  if(!SESSION) return;

  SESSION = null;
  releaseWakeLock();
  if(s.jsTimer) clearInterval(s.jsTimer);
  if(s.native) postNative({ action: "stop" });
  const skips = (summary && summary.skips) || s.skips || 0;
  state.logs.push({ at: (summary && summary.at) || new Date().toISOString(), id: s.res.id, name: s.res.name,
    type: byId(s.res.id).type, min: byId(s.res.id).min, lane: s.res.lane, dist: s.res.distance,
    rpe: byId(s.res.id).rpe, skips: skips, lead: s.lead, diff: Math.round((s.res.diff || 0) * 100) });

  }

/* ---------- today ---------- */
function weekStats(){
  const now = new Date();
  const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  let runs = 0, mi = 0;
  state.logs.forEach(l => {
    const d = new Date(l.at);
    if(d >= mon){ runs++; mi += l.dist || 0; }
  });
  return { runs: runs, mi: Math.round(mi * 100) / 100 };
}
function recommend(){
  const ROT = ["sprint", "tempo", "hill", "mixed"];
  // With no history, start controlled. Sprint is earned after the first log.
  let wantType = "tempo";
  if(state.logs.length){
    const last = state.logs[state.logs.length - 1];
    const li = ROT.indexOf(last.type);
    if(li >= 0) wantType = ROT[(li + 1) % ROT.length];
  }
  const pool = WORKOUTS.filter(w => w.type === wantType);
  // Least recently run of that focus; never-run wins; tie-break shortest.
  const lastRun = id => {
    for(let i = state.logs.length - 1; i >= 0; i--) if(state.logs[i].id === id) return i;
    return -1;
  };
  let best = null, bestScore = Infinity;
  pool.forEach(w => {
    const lr = lastRun(w.id);
    const score = lr < 0 ? -1000 + w.min : lr * 100 + w.min;
    if(score < bestScore){ bestScore = score; best = w; }
  });
  return best || WORKOUTS[0];
}

    '<div class="h-ctas"><button class="btn primary h-start" data-action="startWorkout" data-w="' + rec.id + '">' + icon("play") + " Start</button>" +
    '<button class="btn" data-action="openPreview" data-w="' + rec.id + '">Preview</button></div></div>' +
    '<div class="quiet-action"><span>Range workouts use a ' + fmtMph(state.settings.lane) + ' mph base speed.</span>' +
    '<button class="btn small" data-action="lanePick">Adjust</button></div>' +
    '<div class="quiet-action"><span>Want a different training focus?</span><button class="btn small ghost" data-action="randomRun">Surprise me</button></div>';
}

function effortLabel(rpe){ return rpe >= 9 ? "Very hard" : rpe >= 7 ? "Hard" : rpe >= 5 ? "Moderate" : "Easy"; }

/* ---------- library ---------- */
let libDur = "all", libType = "all", libRpe = "all";
// Uniform draw over all 60: no weighting, no memory, every workout equally
// likely every tap. The preview still gates Start, so a 45-minute RPE 9
// draw never ambushes anyone.
function randomWorkoutId(){
  return WORKOUTS[Math.floor(Math.random() * WORKOUTS.length)].id;
}
function libFiltered(){
  return WORKOUTS.filter(w =>
    (libDur === "all" || w.min === parseInt(libDur, 10)) &&
    (libType === "all" || w.type === libType) &&
    (libRpe === "all" || w.rpe === parseInt(libRpe, 10)));
}
function libraryHtml(){
  const durs = ["all", "20", "25", "30", "35", "40", "45"];
  const types = ["all", "sprint", "tempo", "hill", "mixed"];
  const rpes = ["all", "7", "8", "9"];
  let html = '<div class="lt"><div class="lt-eyebrow">Run Lab</div><h1 class="lt-title">Workouts</h1><div class="lt-sub">Find a run by time, focus or effort.</div></div>';
  html += '<div class="libfilter">' + durs.map(d => '<button class="chipbtn' + (libDur === d ? " on" : "") + '" data-action="libDur" data-v="' + d + '">' + (d === "all" ? "Any" : d + "m") + "</button>").join("") + "</div>";
  html += '<div class="libfilter">' + types.map(t => '<button class="chipbtn' + (libType === t ? " on" : "") + '" data-action="libType" data-v="' + t + '">' + (t === "all" ? "Any type" : TYPE_LABEL[t]) + "</button>").join("") + "</div>";
  html += '<div class="libfilter">' + rpes.map(r => '<button class="chipbtn' + (libRpe === r ? " on" : "") + '" data-action="libRpe" data-v="' + r + '">' + (r === "all" ? "Any RPE" : "RPE " + r) + "</button>").join("") + "</div>";
  const list = libFiltered();
  html += '<div class="small muted" style="margin:2px 0 10px">' + list.length + " workouts</div>";
  html += list.map(w =>
    '<button class="wrow" data-action="openPreview" data-w="' + w.id + '">' +
    '<div class="w-main"><div class="w-name">' + esc(w.name) + '</div>' +
    '<div class="w-sub">' + TYPE_LABEL[w.type] + " " + w.min + " min, B " + (isRange(w) ? w.base.lo + "-" + w.base.hi : fmtMph(w.base)) + ", RPE " + w.rpe + "</div></div>" +
    '<div class="w-dist tnum">' + w.dist.toFixed(2) + " mi</div></button>"
  ).join("");
  return html;
}

/* ---------- preview ---------- */
let previewLane = null, previewId = null;
function openPreview(id){
  const w = byId(id);
  if(!w) return;
  previewId = id;
  previewLane = isRange(w) ? state.settings.lane : null;
  renderPreview(w);
  $("#modal-root").hidden = false;
}
function renderPreview(w){
  const res = resolveWorkout(w, previewLane == null ? undefined : previewLane);
  let laneCtl = "";
  if(isRange(w)){
    const opts = [];
    for(let b = w.base.lo; b <= w.base.hi + 0.001; b += 0.5) opts.push(Math.round(b * 10) / 10);
    laneCtl = '<div class="field"><label>Baseline lane B</label><div class="rowbtns">' +
      opts.map(o => '<button class="chipbtn' + (previewLane === o ? " on" : "") + '" data-action="previewLane" data-v="' + o + '">' + fmtMph(o) + "</button>").join("") + "</div></div>";
  }
  const rows = res.segments.map(s =>
    '<div class="segrow ph-' + s.phase + '"><span class="sg-t">' + fmtClock(s.t0) + "</span>" +
    '<span class="sg-d">' + fmtMph(s.mph) + " mph" + (s.work ? ", work" : "") + "</span>" +
    '<span class="sg-i">' + fmtInc(s.inc) + "</span></div>"
  ).join("");
  $("#modal-root").innerHTML =
    '<div class="sheet"><div class="sheet-head"><div class="grabber"></div><h3>' + esc(w.name) + "</h3>" +
    '<div class="sub">' + TYPE_LABEL[w.type] + ", " + w.min + " min, RPE " + w.rpe +
    (w.prog ? ", progressive" : "") + (w.seed ? ", seed " + w.seed : "") +
    (state.settings.diff ? ", Hard +" + state.settings.diff + "%" : "") +
    ", about " + fmtDist(res.distance) + (isRange(w) ? " at this lane" : "") + "</div></div>" +
    laneCtl +
    '<div class="seglist">' + rows + "</div>" +
    '<div class="rowbtns"><button class="btn" data-action="closeModal">Close</button>' +
    '<button class="btn primary" data-action="startWorkout" data-w="' + w.id + '">' + icon("play") + " Start</button></div></div>";
  modalShown();
}
function closeModal(){
  $("#modal-root").hidden = true;
  $("#modal-root").innerHTML = "";
  document.body.classList.remove("modalopen");
}
function modalShown(){
  // Lock the page behind the sheet: a drag on the backdrop or the header
  // must not scroll the library underneath.
  document.body.classList.add("modalopen");
}
/* Drag-to-dismiss: the header band of any sheet follows a vertical drag
   and releases past 90px closes it. Fingers already try this; making it
   real removes the half-dragged stuck state entirely. */
let SHEET_DRAG = null;
document.addEventListener("pointerdown", e => {
  const head = e.target.closest ? e.target.closest(".sheet-head") : null;
  if(!head) return;
  const sheet = head.closest(".sheet");
  if(!sheet) return;
  SHEET_DRAG = { y0: e.clientY, dy: 0, sheet: sheet, id: e.pointerId };
  sheet.classList.add("dragging");
  try{ sheet.setPointerCapture(e.pointerId); }catch(err){}
});
document.addEventListener("pointermove", e => {
  if(!SHEET_DRAG || e.pointerId !== SHEET_DRAG.id) return;
  SHEET_DRAG.dy = Math.max(0, e.clientY - SHEET_DRAG.y0);
  SHEET_DRAG.sheet.style.transform = "translateY(" + SHEET_DRAG.dy + "px)";
});
function sheetDragEnd(e){
  if(!SHEET_DRAG || (e && e.pointerId !== SHEET_DRAG.id)) return;
  const d = SHEET_DRAG;
  SHEET_DRAG = null;
  d.sheet.classList.remove("dragging");
  d.sheet.style.transform = "";
  if(d.dy > 90) closeModal();
}
document.addEventListener("pointerup", sheetDragEnd);
document.addEventListener("pointercancel", sheetDragEnd);

/* ---------- history ---------- */
function historyHtml(){
  let html = '<div class="lt"><div class="lt-eyebrow">Run Lab</div><h1 class="lt-title">Progress</h1><div class="lt-sub">Your completed runs and weekly consistency.</div></div>';
  const ws = weekStats();
  html += '<div class="weekhero">' +
    '<div class="weekstat"><div class="ws-num tnum">' + ws.runs + '</div><div class="ws-lab">runs this week</div></div>' +
    '<div class="weekstat"><div class="ws-num tnum">' + ws.mi.toFixed(2) + '</div><div class="ws-lab">miles this week</div></div></div>';
  if(!state.logs.length){
    html += '<div class="card"><p class="muted" style="margin:6px 0">No runs yet. The first one shows up here the moment you finish it.</p></div>';
    return html;
  }
  html += state.logs.slice().reverse().map(l =>
    '<div class="hrow"><div class="h-date">' + fmtShort(l.at) + '</div>' +
    '<div class="h-main"><div class="h-name">' + esc(l.name) + '</div>' +
    '<div class="h-sub">' + TYPE_LABEL[l.type] + ", B " + fmtMph(l.lane) + ", " + l.min + " min" + (l.skips ? ", " + l.skips + " skipped" : "") + "</div></div>" +
    '<div class="w-dist tnum">' + (l.dist || 0).toFixed(2) + " mi</div></div>"
  ).join("");
  return html;
}

/* ---------- guide + settings ---------- */
const BUILD_MARK = "Build 2026.08.21r5";
function guideHtml(){
  return '<div class="lt"><div class="lt-eyebrow">Run Lab</div><h1 class="lt-title">Guide</h1></div>' +
    '<div class="card tight">' + settingsHtml() + "</div>" +
    '<div class="gsec"><h3>Difficulty</h3><p>The difficulty dial makes every work step bigger: speeds above your baseline and grades above 1% scale up by the percentage you pick, and the 10.0 mph and 9% caps still apply. Warm-ups, cool-downs and recoveries never change, so harder means a wider gap between work and rest, not a faster jog between efforts. Beginner is the library exactly as published; Intermediate is +20% and Expert is +30%, or set your own with the stepper.</p></div>' +
    '<div class="gsec"><h3>Lanes and B</h3><p>Every workout hangs off one baseline lane, B. Speeds in the blocks are written as offsets from it: B+2 means two mph above your lane. Fixed workouts lock B (4, 5 or 6 mph). Range workouts let you pick any lane between 4.0 and 6.0 before you start; the whole run then resolves from that single number and never jumps around mid-run.</p></div>' +
    '<div class="gsec"><h3>Progression</h3><p>Progressive workouts climb as the main blocks tick by: sprint work adds +0.20 mph per completed block, tempo work +0.15 mph, hill grades above 1% add +0.5 points, and mixed climbs both ways. Speeds cap at 10.0 mph and grades at 9%. Warm-up and cool-down never progress.</p></div>' +
    '<div class="gsec"><h3>The voice</h3><p>Every change is called out ahead of time: a ten-second warning, then the target, spoken like a treadmill console reads. Speeds and inclines that stay the same are not repeated. A spoken 3-2-1 counts you into short work pieces of 30 seconds or less. Tones mode replaces all speech with beeps if you would rather keep your podcast clean.</p></div>' +
    '<div class="gsec"><h3>Console lag</h3><p>Treadmill consoles take a moment to reach a new speed or grade, so cues fire slightly before the printed time. The lead setting (default 3 seconds) tunes that to your machine.</p></div>' +
    '<div class="gsec"><h3>Safety</h3><p>Stop and seek help immediately for chest pain, faintness, or unusual shortness of breath. Do not push through symptoms to finish a block. The safety key belongs on you, not the console.</p></div>' +
    '<div class="gsec"><h3>Sourcing</h3><p>The interval style follows how popular treadmill classes publicly describe their cardio: guided intervals across walking, jogging, running, hills and speed pushes, with coaches calling out ranges that each runner scales to their own level. No branded or proprietary class scripts were used; every workout in this library was synthesized from those public principles plus published training research on interval, hill and tempo training.</p></div>' +
    '<div class="gsec"><h3>Privacy and data</h3><p>No account, analytics, ads or tracking. Settings and run history stay on this device. Export creates a plain JSON backup; Import replaces the current state.</p>' +
    '<div class="rowbtns" style="margin-top:8px"><button class="btn" data-action="privacyOpen">Privacy policy</button><button class="btn" data-action="exportOpen">Export</button><button class="btn" data-action="importOpen">Import</button><button class="btn danger" data-action="eraseOpen">Erase all data</button></div></div>' +
    '<div class="gsec"><h3>Help</h3><p>If cues stop, confirm Cue mode here and raise media volume. If saved data looks wrong, export it before reinstalling or clearing site data.</p></div>' +
    '<p class="small muted">' + BUILD_MARK + "</p>";
}
function settingsHtml(){
  return '<div class="setrow"><div><div class="s-lab">Cue mode</div><div class="s-sub">Voice calls the changes, or tones only</div></div>' +
    '<div class="rowbtns"><button class="chipbtn' + (state.settings.voice === "speech" ? " on" : "") + '" data-action="setVoice" data-v="speech">Voice</button>' +
    '<button class="chipbtn' + (state.settings.voice === "tones" ? " on" : "") + '" data-action="setVoice" data-v="tones">Tones</button></div></div>' +
    '<div class="setrow"><div><div class="s-lab">Console lead</div><div class="s-sub">Cue this many seconds early</div></div>' +
    '<div class="rowbtns">' + [0, 2, 3, 5].map(v => '<button class="chipbtn' + (state.settings.lead === v ? " on" : "") + '" data-action="setLead" data-v="' + v + '">' + v + "s</button>").join("") + "</div></div>" +
    '<div class="setrow"><div><div class="s-lab">Default lane B</div><div class="s-sub">For range workouts</div></div>' +
    '<div class="rowbtns">' + [4, 4.5, 5, 5.5, 6].map(v => '<button class="chipbtn' + (state.settings.lane === v ? " on" : "") + '" data-action="setLane" data-v="' + v + '">' + fmtMph(v) + "</button>").join("") + "</div></div>" +
    '<div class="setrow"><div><div class="s-lab">Difficulty</div><div class="s-sub">Scales work speeds and grades, never recoveries</div></div>' +
    '<div class="rowbtns">' +
    '<button class="chipbtn' + (state.settings.diff === 0 ? " on" : "") + '" data-action="setDiff" data-v="0">Beginner</button>' +
    '<button class="chipbtn' + (state.settings.diff === 20 ? " on" : "") + '" data-action="setDiff" data-v="20">Intermediate</button>' +
    '<button class="chipbtn' + (state.settings.diff === 30 ? " on" : "") + '" data-action="setDiff" data-v="30">Expert</button>' +
    '<button class="chipbtn" data-action="diffAdj" data-v="-5" aria-label="Less hard">-</button>' +
    '<span class="chip' + (state.settings.diff ? " clay" : "") + '">Hard +' + state.settings.diff + "%</span>" +
    '<button class="chipbtn" data-action="diffAdj" data-v="5" aria-label="More hard">+</button>' +
    "</div></div>";
}

/* ---------- export / import ---------- */
function privacyOpen(){
  $("#modal-root").hidden = false;
  $("#modal-root").innerHTML = '<div class="sheet"><div class="' + 'sheet-head"><div class="grabber"></div><h3>Privacy policy</h3>' +
    '<div class="sub">Last updated 21 August 2026</div></div>' +
    '<div class="gsec"><h3>The short version</h3><p>Run Lab collects nothing. There are no accounts, analytics, ads, tracking or network requests. Your settings and workout history stay on this device.</p></div>' +
    '<div class="gsec"><h3>Your control</h3><p>Export gives you a portable JSON backup. Import replaces the current state. Erase all data removes local history, settings, backups and any pending native finish.</p></div>' +
    '<div class="gsec"><h3>Permissions and safety</h3><p>The installed app requests no permissions. Speech and audio cues run on device. Run Lab is a training tool, not medical advice.</p></div>' +
    '<button class="btn primary" data-action="closeModal">Done</button></div>';
  modalShown();
}
function eraseOpen(){
  $("#modal-root").hidden = false;
  $("#modal-root").innerHTML = '<div class="sheet"><div class="' + 'sheet-head"><div class="grabber"></div><h3>Erase all data?</h3>' +
    '<div class="sub">This permanently removes run history, settings and local backups from this device. Export first if you want a copy.</div></div>' +
    '<div class="rowbtns"><button class="btn" data-action="closeModal">Cancel</button><button class="btn danger" data-action="eraseConfirm">Erase everything</button></div></div>';
  modalShown();
}
function eraseAllData(){
  try{
    const keys = [];
    for(let i = 0; i < localStorage.length; i++) keys.push(localStorage.key(i));
    keys.filter(k => k && (k === STORE_KEY || k === BACKUP_KEY || k.indexOf("runner.corrupt.") === 0)).forEach(k => localStorage.removeItem(k));
  }catch(e){}
  postNative({ action: "resetData" });
  state = hydrate(null);
  Store.save(state);
  closeModal();
  render();
  toast("All Run Lab data erased");
}
function exportOpen(){
  $("#modal-root").hidden = false;
  $("#modal-root").innerHTML = '<div class="sheet"><div class="sheet-head"><div class="grabber"></div><h3>Export</h3>' +
    '<div class="sub">Copy this JSON somewhere safe.</div></div>' +
    '<div class="field"><textarea id="expjson" style="width:100%;min-height:200px;background:#0E1116;border:1px solid var(--border);border-radius:10px;padding:10px"></textarea></div>' +
    '<div class="rowbtns"><button class="btn" data-action="closeModal">Close</button><button class="btn primary" data-action="copyExport">Copy</button></div></div>';
  modalShown();
  $("#expjson").value = JSON.stringify(state);
}
function importOpen(){
  $("#modal-root").hidden = false;
  $("#modal-root").innerHTML = '<div class="sheet"><div class="sheet-head"><div class="grabber"></div><h3>Import</h3>' +
    '<div class="sub">Paste an exported JSON. This replaces the current state.</div></div>' +
    '<div class="field"><textarea id="impjson" style="width:100%;min-height:200px;background:#0E1116;border:1px solid var(--border);border-radius:10px;padding:10px"></textarea></div>' +
    '<div class="rowbtns"><button class="btn" data-action="closeModal">Cancel</button><button class="btn primary" data-action="doImport">Import</button></div></div>';
  modalShown();
}

/* ---------- render ---------- */
function render(){
  if(bootBlocked || !state){
    document.getElementById("app").innerHTML = recoveryScreenHtml() + navHtml();
    return;
  }
  let html = "";
  if(bootRestoredAt){
    html += '<div class="banner skyb"><div class="grow">Saved data was unreadable, so it was restored from the backup copy made ' + esc(fmtShort(bootRestoredAt)) + '.</div>' +
      '<button class="btn small" data-action="dismissRestore">OK</button></div>';
  }
  html += '<div class="page">' + (currentTab === "today" ? todayHtml() : currentTab === "library" ? libraryHtml() : currentTab === "history" ? historyHtml() : guideHtml()) + "</div>";
  document.getElementById("app").innerHTML = html + navHtml();
}

/* ---------- confirm sheet ---------- */
function confirmSheet(msg, action){
  $("#modal-root").hidden = false;
  $("#modal-root").innerHTML = '<div class="sheet"><div class="sheet-head"><div class="grabber"></div><h3>End workout?</h3><div class="sub">' + esc(msg) + "</div></div>" +
    '<div class="rowbtns"><button class="btn" data-action="closeModal">Keep going</button>' +
    '<button class="btn danger" data-action="' + action + '">End</button></div></div>';
  modalShown();
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action]");
  if(!t) return;
  const a = t.getAttribute("data-action");
  switch(a){
    case "tab": currentTab = t.getAttribute("data-tab"); window.scrollTo(0, 0); render(); break;
    case "dismissWarn": if(warnEl){ warnEl.remove(); warnEl = null; } break;
    case "dismissRestore": bootRestoredAt = null; render(); break;
    case "recoveryImport": importOpen(); break;
    case "recoveryFresh":
      state = hydrate(null); save(); location.reload(); break;
    case "startWorkout": {
      if(SESSION){ toast("A workout is already running"); break; }
      const id = t.getAttribute("data-w");
      closeModal();
      startWorkout(id, previewLane);
      break;
    }
    case "openPreview": openPreview(t.getAttribute("data-w")); break;
    case "previewLane": previewLane = parseFloat(t.getAttribute("data-v")); renderPreview(byId(previewId)); break;
    case "closeModal": closeModal(); break;
    case "libDur": libDur = t.getAttribute("data-v"); render(); break;
    case "libType": libType = t.getAttribute("data-v"); render(); break;
    case "libRpe": libRpe = t.getAttribute("data-v"); render(); break;
    case "setVoice": state.settings.voice = t.getAttribute("data-v"); save(); render(); break;
    case "setLead": state.settings.lead = parseInt(t.getAttribute("data-v"), 10); save(); render(); break;
    case "setLane": state.settings.lane = parseFloat(t.getAttribute("data-v")); save(); render(); break;
    case "setDiff":
      state.settings.diff = Math.max(0, Math.min(50, parseInt(t.getAttribute("data-v"), 10) || 0)); save(); render(); break;
    case "diffAdj":
      state.settings.diff = Math.max(0, Math.min(50, (state.settings.diff || 0) + parseInt(t.getAttribute("data-v"), 10))); save(); render(); break;
    case "randomRun": openPreview(randomWorkoutId()); break;
    case "lanePick": currentTab = "guide"; render(); window.scrollTo(0, 0); break;
    case "pauseToggle": pauseToggle(); break;
    case "skipSegment": skipSegment(); break;
    case "stopRun": if(SESSION) confirmSheet("Your run will not be saved.", "stopRunConfirm"); break;
    case "stopRunConfirm": closeModal(); stopWorkout(); break;
    case "finishClose": closeRun(); render(); break;
    case "exportOpen": exportOpen(); break;
    case "importOpen": importOpen(); break;
    case "privacyOpen": privacyOpen(); break;
    case "eraseOpen": eraseOpen(); break;
    case "eraseConfirm": eraseAllData(); break;
    case "copyExport": {
      const ta = $("#expjson");
      ta.select();
      try{ document.execCommand("copy"); toast("Copied"); }catch(err){ toast("Select and copy manually"); }
      break;
    }
    case "doImport": {
      try{
        const p = JSON.parse($("#impjson").value);
        if(!p || p.version !== 1) throw new Error("bad");
        state = hydrate(p); save(); closeModal(); render(); toast("Imported");
      }catch(err){ toast("That does not look like a Run Lab export"); }
      break;
    }
  }
});
let toastTimer = null;
function toast(msg){
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
}

/* If a workout finished while the page was not loaded (app killed after a
   background finish), the native runner replays it here on next boot.
   finishAck is ALWAYS sent, whether this call recorded the entry or
   deduped a replay: the ack is the only thing that clears the native
   pending copy, so it must fire even when there is nothing left to do. */
window.Runner.onPending = function(summaryJson){
  try{
    const s = typeof summaryJson === "string" ? JSON.parse(summaryJson) : summaryJson;
    if(s && s.at && !state.logs.some(l => l.at === s.at)){
      const w = byId(s.id);
      if(w){
        state.logs.push({ at: s.at, id: s.id, name: s.name || w.name, type: w.type, min: w.min,
          lane: s.lane, dist: s.dist, rpe: w.rpe, skips: s.skips || 0, lead: s.lead || state.settings.lead });
        save(); render();
      }
    }
  }catch(e){}
  postNative({ action: "finishAck" });
};
postNative({ action: "collectPending" });

render();
</script>
